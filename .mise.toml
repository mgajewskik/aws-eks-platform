[tool_alias]
infracost = "github:infracost/cli"

[settings]
task.run_auto_install = false

[env]
_.file = { path = ".env.local", redact = true }

AWS_REGION = "eu-north-1"
AWS_DEFAULT_REGION = "eu-north-1"
AWS_ACCOUNT_ID = "220263133738"

[tools]
aws = "2.36.40"
jq = "1.8.2"
pre-commit = "4.6.2"
python = "3.14.2"
uv = "0.9.25"
terraform = "1.16.1"
tflint = "0.64.0"
trivy = "0.74.0"
infracost = "2.16.3"

[tasks.checks]
description = "Required non-mutating gates"
run = "scripts/checks.sh"

[tasks.docs-gate]
description = "Feature-close documentation contract"
run = "scripts/docs-gate.sh"

[tasks.test-harness]
description = "Local harness regression tests; no cloud or cost API calls"
run = "uv run --locked --no-sync --no-env-file pytest"

[tasks.cost]
description = "Opt-in Infracost scan. Uses repo env from .env.local. Skips the API when docs/cost.md matches."
run = "scripts/cost.sh"

[tasks.init]
description = "Owner-run Terraform init with -reconfigure and backend settings from backend.s3.hcl"
run = "terraform -chdir=platform init -reconfigure -backend-config=backend.s3.hcl"

[tasks.plan]
description = "Owner-run Terraform plan with default.tfvars; displays changes without saving a plan file"
run = "terraform -chdir=platform plan -var-file=default.tfvars"

[tasks.apply]
description = "Owner-run Terraform apply with default.tfvars; applies a fresh plan without a confirmation prompt"
run = "terraform -chdir=platform apply -var-file=default.tfvars -auto-approve"

[tasks.destroy]
description = "Owner-run Terraform destroy with default.tfvars; deletes resources without a confirmation prompt"
run = "terraform -chdir=platform destroy -var-file=default.tfvars -auto-approve"

[tasks.bastion]
description = "Owner-run SSM shell on this deployment's bastion"
run = "bash scripts/bastion.sh ssm"

[tasks.ssh]
description = "Owner-run SSH to the bastion through SSM using the local aws-eks-platform key"
run = "bash scripts/bastion.sh ssh"

[tasks.vpn]
description = "Owner-run sshuttle for the VPC and ordinary DNS; uses local sudo and stops with Ctrl+C"
run = "uv run --locked --no-sync --no-env-file bash scripts/bastion.sh vpn"
