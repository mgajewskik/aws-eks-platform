[tool_alias]
infracost = "github:infracost/cli"

[settings]
task.run_auto_install = false

[env]
_.file = { path = ".env.local", redact = true }

AWS_REGION = "eu-north-1"
AWS_DEFAULT_REGION = "eu-north-1"
DEVCONTAINER_AWS_ROLE_ARN = "arn:aws:iam::220263133738:role/devcontainer"

[tools]
aws = "2.36.40"
jq = "1.8.2"
pre-commit = "4.6.2"
python = "3.14.2"
uv = "0.9.25"
terraform = "1.16.1"
tflint = "0.64.0"
trivy = "0.74.0"
infracost = "2.16.3"

[tasks.checks]
description = "Required non-mutating gates"
run = "scripts/checks.sh"

[tasks.test-harness]
description = "Local harness regression tests; no cloud or cost API calls"
run = "uv run --locked --no-sync --no-env-file pytest"

[tasks.cost]
description = "Infracost scan at feature close; skips the API while docs/cost.md matches. --check never calls it."
run = "scripts/cost.sh"

[tasks.init]
description = "Owner-run Terraform init with -reconfigure and backend settings from backend.s3.hcl"
run = "terraform -chdir=platform init -reconfigure -backend-config=backend.s3.hcl"

[tasks.plan]
description = "Plan with default.tfvars; saves platform/tfplan only if the plan policy passes. Pass -destroy to tear down."
run = "scripts/plan.sh"

[tasks.apply]
description = "Owner-run: apply exactly the saved platform/tfplan, without a prompt, then discard it"
run = ["terraform -chdir=platform apply -input=false tfplan", "rm platform/tfplan"]

[tasks.verify-live]
description = "Read-only checks of the deployed platform; needs AWS credentials"
run = "uv run --locked --no-sync --no-env-file pytest tests/live/test_deployed.py"

[tasks.bastion]
description = "Owner-run SSM shell on this deployment's bastion"
run = "bash scripts/bastion.sh ssm"

[tasks.ssh]
description = "Owner-run SSH to the bastion through SSM using the local aws-eks-platform key"
run = "bash scripts/bastion.sh ssh"

[tasks.vpn]
description = "Owner-run sshuttle for the VPC and ordinary DNS; uses local sudo and stops with Ctrl+C"
run = "uv run --locked --no-sync --no-env-file bash scripts/bastion.sh vpn"
