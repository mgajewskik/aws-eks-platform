[project]
name = "eks-platform"
version = "0.1.0"
description = "Operator tools and checks for the EKS platform"
requires-python = ">=3.14"
dependencies = ["sshuttle==1.3.2"]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/harness"]
pythonpath = ["scripts"]
addopts = "--strict-config --strict-markers -ra"
